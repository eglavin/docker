name: syncthing

services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest # https://docs.linuxserver.io/images/docker-syncthing/
    container_name: syncthing
    restart: unless-stopped
    hostname: syncthing
    ports:
      - 8384:8384
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config:/config
      - ${MOUNT_POINT}:/data1
